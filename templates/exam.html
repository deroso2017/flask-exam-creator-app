{% extends 'base.html' %}

{% block content %}
<form method="POST" action="/submit_exam">
    <input
        type="hidden"
        name="exam_type"
        value="{{ exam_type }}"
    >
    {% for q in questions %}
        <div class="bg-white p-6 rounded shadow mb-6">

            <h2 class="font-bold mb-4">
                {{ loop.index }}.
                {{ q.question }}
            </h2>

            <input
                type="hidden"
                name="question_ids"
                value="{{ q.id }}"
            >
            <div class="space-y-2">

                <label class="block">
                    <input
                        type="radio"
                        name="question_{{ q.id }}"
                        value="A"
                    >
                    A. {{ q.option_a }}
                </label>

                <label class="block">
                    <input
                        type="radio"
                        name="question_{{ q.id }}"
                        value="B"
                    >
                    B. {{ q.option_b }}
                </label>

                <label class="block">
                    <input
                        type="radio"
                        name="question_{{ q.id }}"
                        value="C"
                    >
                    C. {{ q.option_c }}
                </label>

                <label class="block">
                    <input
                        type="radio"
                        name="question_{{ q.id }}"
                        value="D"
                    >
                    D. {{ q.option_d }}
                </label>

            </div>

        </div>

    {% endfor %}

    <button
        class="bg-blue-600 text-white px-6 py-3 rounded"
    >
        Submit Exam
    </button>

</form>
{% endblock %}
